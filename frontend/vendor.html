<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="robots" content="noindex">
  <title>CafeQ — Vendor</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="vendor">
  <header class="app-header">
    <div class="bar">
      <div>
        <h1>CafeQ Vendor</h1>
        <div class="sub" id="vendor-sub">Tap to update your counter</div>
      </div>
      <button class="link-btn" id="logout-btn" type="button" hidden>Log out</button>
    </div>
  </header>

  <main class="container">
    <!-- Step 1: PIN entry -->
    <form class="pin-screen" id="pin-form" autocomplete="off">
      <label for="pin-input"><strong>Enter vendor PIN</strong></label>
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" required
             aria-describedby="pin-error">
      <p class="pin-error" id="pin-error" role="alert"></p>
      <button class="btn-primary" type="submit">Log in</button>
    </form>

    <!-- Step 2: Dashboard -->
    <section id="dashboard" hidden>
      <div class="field" id="cafe-field">
        <label for="vendor-cafe">Your cafe</label>
        <select id="vendor-cafe"></select>
      </div>

      <div class="vendor-current" aria-live="polite">
        <span class="dot unknown" id="current-dot" aria-hidden="true"></span>
        <span id="current-text">Loading current status…</span>
      </div>

      <div class="vendor-buttons" id="status-buttons">
        <button class="vendor-btn green" type="button" data-status="green">🟢 FREE</button>
        <button class="vendor-btn yellow" type="button" data-status="yellow">🟡 MODERATE</button>
        <button class="vendor-btn red" type="button" data-status="red">🔴 BUSY</button>
      </div>

      <div class="order-block">
        <div class="field">
          <label for="order-item">Item (optional)</label>
          <select id="order-item">
            <option value="">— Any item —</option>
          </select>
        </div>
        <button class="order-btn" id="order-btn" type="button">ORDER SERVED ✓</button>
        <div class="order-counter" id="order-counter" aria-live="polite">Orders today: —</div>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">Total orders today</div><div class="v" id="stat-total">—</div></div>
        <div class="stat"><div class="k">Busiest hour</div><div class="v" id="stat-busiest">—</div></div>
        <div class="stat"><div class="k">Orders last 15 min</div><div class="v" id="stat-15">—</div></div>
        <div class="stat"><div class="k">Student reports (10 min)</div><div class="v" id="stat-reports">—</div></div>
      </div>

      <p class="footer-note">A status expires after 15 minutes and shows as Unknown to students — tap again when the queue changes.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/js/vendor.js" defer></script>
</body>
</html>
